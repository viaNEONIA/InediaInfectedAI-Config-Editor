<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InediaInfectedAI Config Editor v9</title>
<style>
:root{--bg:#0f1319;--panel:#171d25;--panel2:#202833;--text:#e8edf3;--muted:#9ba8b6;--line:#303a47;--accent:#62a8ff;--good:#55d187;--warn:#ffcc66;--bad:#ff6b6b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:#111720ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 14px 0 0}.spacer{flex:1}
button,.filebtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover,.filebtn:hover{border-color:var(--accent)} .primary{background:#1769c2;border-color:#2b80df}.danger{border-color:#6d3434}
input[type=file]{display:none}
.search{width:min(340px,100%);background:#0c1117;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);padding:14px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
nav button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent}
main{padding:18px;max-width:1250px;width:100%}
.notice{background:#152234;border:1px solid #28496f;padding:12px 14px;border-radius:10px;margin-bottom:16px;color:#cfe5ff}
.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.section>summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:16px;background:#1a222c}
.sectionbody{padding:10px 14px 14px}
.field{display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(220px,1fr);gap:14px;align-items:center;padding:10px 4px;border-bottom:1px solid #252e39}
.field:last-child{border-bottom:0}.name{font-weight:600;overflow-wrap:anywhere}.path{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.control{display:flex;gap:8px;align-items:center}.control input[type=number],.control input[type=text],textarea{width:100%;background:#0d1218;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
textarea{min-height:92px;font-family:ui-monospace,monospace;resize:vertical}
.switch{position:relative;width:46px;height:25px;display:inline-block}.switch input{display:none}.slider{position:absolute;inset:0;background:#3b4653;border-radius:99px;cursor:pointer}.slider:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:white;border-radius:50%;transition:.15s}.switch input:checked+.slider{background:var(--good)}.switch input:checked+.slider:before{transform:translateX(21px)}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:#26303b;color:#cbd5df}.on{color:var(--good)}.off{color:var(--muted)}
.groupbox{border:1px solid #293442;border-radius:9px;padding:8px;margin:7px 0}.groupbox summary{cursor:pointer;font-weight:600}
.footer{color:var(--muted);font-size:12px;margin:22px 0}
#status{font-size:12px;color:var(--good)}
@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:none}.field{grid-template-columns:1fr}.search{order:10;width:100%}}

.jpGuide{font-size:13px;line-height:1.55;margin:7px 0 9px;padding:9px 11px;border-left:3px solid #4c8bf5;background:rgba(76,139,245,.08);border-radius:5px}
.jpGuide .jpTitle{font-weight:700;font-size:14px}
.jpGuide .jpDesc{opacity:.86;margin-top:2px}
.jpGuide .jpUnit{display:inline-block;margin-top:4px;font-size:11px;padding:1px 6px;border:1px solid rgba(127,127,127,.35);border-radius:10px}
.wikiNote{font-size:12px;opacity:.75;margin:8px 0}

.editList{margin:8px 0;padding:10px;border:1px solid rgba(127,127,127,.28);border-radius:8px}
.editListRow{display:flex;gap:6px;margin:5px 0;align-items:center}.editListRow input{flex:1}.editListRow button{padding:5px 9px}
.editListTitle{font-size:12px;font-weight:700;margin-bottom:6px}.editListAdd{margin-top:6px}

.overrideEditor{margin:9px 0;padding:10px;border:1px solid rgba(127,127,127,.30);border-radius:8px}
.overrideTitle{font-weight:700;font-size:12px;margin-bottom:6px}
.overrideRow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(100px,160px) auto;gap:7px;margin:5px 0;align-items:center}
.overrideRow input{width:100%;box-sizing:border-box}
.overrideHint{font-size:11px;opacity:.72;margin:4px 0 8px}
.overrideAdd{margin-top:6px}
</style>
</head>
<body>
<header>
<h1>InediaInfectedAI Config Editor v9</h1>
<label class="filebtn">JSONを開く<input id="file" type="file" accept=".json,application/json"></label>
<button id="saveLocal">設定を保存（JSONダウンロード）</button>
<button id="restoreLocal">設定を復元</button>
<button id="reset" class="danger">公式初期設定に戻す</button>
<button id="validate">検証</button>
<button id="export" class="primary">JSONを出力</button>
<div class="spacer"></div><span id="status">オフライン動作</span>
<input id="search" class="search" placeholder="設定名・パスを検索">
</header>
<div class="layout">
<nav id="nav"></nav>
<main>
<div class="notice">
このHTMLは単体で動作し、外部通信を行いません。今回提供されたWiki公式初期設定JSONを初期値として内蔵しています。起動時は常に公式初期設定から開始します。主要設定には日本語ガイドと単位表示を追加しています。
0/1型の有効・無効項目はトグル、数値は数値入力、文字列はテキスト、配列・複雑なオブジェクトはJSON編集欄として表示します。
</div>
<div id="app"></div>
<div class="footer">出力時はブラウザ内の現在値から InediaInfectedAIConfig.json を生成します。サーバー上のファイルを直接変更する機能はありません。</div>
</main>
</div>
